name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # macOS, and not by preference: st_birthtime, lsof and the PyObjC bridge that carries Apple's
    # language recognizer are all macOS only. The standard runner is free on a public repository.
    runs-on: macos-latest
    # The suite is process-heavy and the runner is about seven times slower at it than a laptop:
    # 18 minutes under the system python, and the first attempt at 30 was cut off mid-run.
    timeout-minutes: 60
    strategy:
      # Both interpreters, because they are both real, and one at a time in its own job so that a
      # slow run cannot eat the other's budget. The launcher runs whichever python3 is on PATH, and
      # the language step always runs /usr/bin/python3, which is 3.9: a 3.10 syntax anywhere would
      # pass under the first of these and fail under the second.
      fail-fast: false
      matrix:
        python: [python3, /usr/bin/python3]
    name: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # nothing here pushes, so the job has no use for the token

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: The suite
        env:
          PY: ${{ matrix.python }}
        run: |
          "$PY" --version
          "$PY" -m unittest discover -s tests -v
